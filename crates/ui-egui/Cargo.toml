[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[features]
default = []
# deckrt: draw 3D models through wgpu (the desktop app); without it the software rasteriser draws them.
gpu3d = ["dep:egui-wgpu", "deckcraft-model3d/gpu"]

[dependencies]
chrono.workspace = true
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
# deckrt
deckcraft-interactive = { workspace = true }
deckcraft-model3d = { workspace = true }
deckcraft-phones = { workspace = true }
deckcraft-captions = { workspace = true }
deckcraft-show-ext = { workspace = true }
egui-wgpu = { version = "0.36", optional = true }
image = { workspace = true }
qrcode = { version = "0.14", default-features = false }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
